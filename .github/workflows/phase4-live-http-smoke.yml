name: Phase 4 Live HTTP Smoke
on:
  push:
    branches:
      - ops/phase4-live-http-smoke-8b1262e
permissions:
  contents: read
jobs:
  live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live public catalog and availability via HTTPS GET
        shell: bash
        run: |
          python3 - <<'PY'
          import json, ssl, urllib.request, urllib.parse, datetime, time, sys
          BASE="https://imperio-backend-production-5086.up.railway.app"
          UNITS=("centro","big","shopping-contagem")
          DATE=(datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=-3))).date()+datetime.timedelta(days=2)).isoformat()
          out={"date":DATE,"units":[],"requests":0,"writes":0}
          ctx=ssl.create_default_context()
          def get(path,params):
              url=BASE+path+"?"+urllib.parse.urlencode(params)
              start=time.monotonic()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"phase4-read-only-smoke/1"},method="GET"),timeout=18,context=ctx) as resp:
                      status=resp.status
                      if urllib.parse.urlparse(resp.geturl()).hostname != urllib.parse.urlparse(BASE).hostname: raise ValueError("unexpected redirect host")
                      data=json.loads(resp.read(2000000))
              except Exception as exc:
                  out["requests"]+=1
                  return None,{"httpStatus":getattr(exc,"code",None),"errorCode":type(exc).__name__,"durationMs":round((time.monotonic()-start)*1000)}
              out["requests"]+=1
              return data,{"httpStatus":status,"durationMs":round((time.monotonic()-start)*1000)}
          ok=True
          for unit in UNITS:
              data,meta=get("/api/v1/public/catalog",{"unitId":unit})
              row={"unitId":unit,"catalog":meta}
              if not isinstance(data,dict):
                  row["catalog"]["validation"]="INVALID_JSON_OR_RESPONSE";ok=False;out["units"].append(row);continue
              services=data.get("services")
              pros=data.get("professionals")
              valid=(meta.get("httpStatus")==200 and isinstance(data.get("unit"),dict) and data["unit"].get("id")==unit and isinstance(services,list) and isinstance(pros,list) and isinstance(data.get("bookingEnabled"),bool))
              row["catalog"].update({"validation":"PASS" if valid else "FAIL","serviceCount":len(services) if isinstance(services,list) else None,"professionalCount":len(pros) if isinstance(pros,list) else None,"bookingEnabled":data.get("bookingEnabled") if isinstance(data.get("bookingEnabled"),bool) else None})
              if not valid:ok=False;out["units"].append(row);continue
              if not services:
                  row["availability"]={"validation":"NOT_APPLICABLE","reason":"NO_PUBLISHED_SERVICES"}
                  out["units"].append(row);continue
              service=next((x for x in services if isinstance(x,dict) and isinstance(x.get("id"),str) and x.get("id")),None)
              if not service:row["availability"]={"validation":"FAIL","reason":"NO_VALID_SERVICE_ID"};ok=False;out["units"].append(row);continue
              av,am=get("/api/v1/public/availability",{"unitId":unit,"date":DATE,"serviceId":service["id"]})
              avvalid=(am.get("httpStatus")==200 and isinstance(av,dict) and av.get("unitId")==unit and av.get("date")==DATE and av.get("serviceId")==service["id"] and isinstance(av.get("bookingEnabled"),bool) and isinstance(av.get("slots"),list))
              row["availability"]={**am,"validation":"PASS" if avvalid else "FAIL","bookingEnabled":av.get("bookingEnabled") if isinstance(av,dict) and isinstance(av.get("bookingEnabled"),bool) else None,"slotCount":len(av["slots"]) if isinstance(av,dict) and isinstance(av.get("slots"),list) else None}
              if not avvalid:ok=False
              out["units"].append(row)
          out["gate"]="PASS" if ok else "FAIL"
          print("PHASE4_SANITIZED_JSON="+json.dumps(out,ensure_ascii=False,separators=(",",":")))
          sys.exit(0 if ok else 1)
          PY
