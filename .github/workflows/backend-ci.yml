name: V98 Backend CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imperio
          POSTGRES_PASSWORD: imperio_ci
          POSTGRES_DB: imperio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imperio -d imperio_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://imperio:imperio_ci@localhost:5432/imperio_ci?schema=public
      READINESS_TEST_DATABASE: imperio_ci
      PORT: 3100
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://127.0.0.1:3101
      MIGRATION_IMPORT_ENABLED: "true"
      MIGRATION_REQUIRE_CANONICAL: "true"
      READ_THROUGH_ENABLED: "false"
      SHADOW_READS_ENABLED: "false"
      OPERATIONAL_WRITES_ENABLED: "false"
      WHATSAPP_AUTOMATION_ENABLED: "false"
      EVOLUTION_WEBHOOK_ENABLED: "false"
      WHATSAPP_AGENT_API_ENABLED: "false"
      MESSAGING_SENDING_STALE_MS: "300000"
      ADMIN_USERNAME: ci_owner
      ADMIN_PASSWORD: ci-owner-password-123
      ADMIN_NAME: CI Owner
      JSON_BODY_LIMIT: 20mb
      MIGRATION_BATCH_SIZE: "500"
      MIGRATION_TX_TIMEOUT_MS: "60000"
      MIGRATION_PROMOTION_TX_TIMEOUT_MS: "180000"
      MIGRATION_STAGE_RETENTION_DAYS: "30"
      BUSINESS_TIMEZONE: America/Sao_Paulo
      OPENAPI_ENABLED: "true"
      LOGIN_RATE_LIMIT_MAX: "5"
      LOGIN_RATE_LIMIT_WINDOW_MS: "900000"
      LOGIN_RATE_LIMIT_BLOCK_MS: "900000"
      ACTIVATION_TOKEN_TTL_MS: "86400000"
      RESET_TOKEN_TTL_MS: "1800000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Apply migrations
        run: npm run prisma:migrate
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: WA1 messaging foundation
        run: npm run test:wa1
      - name: WA2 Evolution messaging
        run: npm run test:wa2
      - name: WA2.1 stale SENDING recovery
        run: npm run test:wa2.1
      - name: WA2.2 safe Outbox reconciliation
        working-directory: backend
        run: npm run test:wa2.2
      - name: WhatsApp read-only preflight contract
        run: npm run test:whatsapp-preflight
      - name: WA3A server-side availability
        run: npm run test:wa3a
      - name: WA3B authoritative agent booking
        run: npm run test:wa3b
      - name: WA3C.1 multi-service availability
        run: npm run test:wa3c1
      - name: WA3C.2 secure multi-service query
        run: npm run test:wa3c2
      - name: WA3C.3 authoritative multi-service creation
        run: npm run test:wa3c3
      - name: WA3C.4 regressions and parity
        run: npm run test:wa3c4
      - name: WA4.1 existing waitlist audit
        run: npm run test:wa4.1
      - name: WA4.2 agent waitlist creation
        run: npm run test:wa4.2
      - name: WA4.3 reception notification
        run: npm run test:wa4.3
      - name: WA4.4 opportunity matching
        run: npm run test:wa4.4
      - name: WA4.5 future offer candidate
        run: npm run test:wa4.5
      - name: WA4.6 states and traceability
        run: npm run test:wa4.6
      - name: WA4.7 existing queue UI bridge
        run: npm run test:wa4.7
      - name: WA4 end-to-end
        run: npm run test:wa4-e2e
      - name: WA5.2 booking automation materialization
        run: npm run test:wa5.2
      - name: WA5.3 booking automation lifecycle
        run: npm run test:wa5.3
      - name: WA5.4 temporal automation rules
        run: npm run test:wa5.4
      - name: WA5.5 waitlist offer automation
        run: npm run test:wa5.5
      - name: WA5.6 post-service automation
        run: npm run test:wa5.6
      - name: WA5.7 automation to Outbox bridge
        run: npm run test:wa5.7
      - name: WA5.8 end-to-end and security
        run: npm run test:wa5.8
      - name: Static and projector tests
        run: npm test
      - name: Frontend central bridge contract
        run: npm run test:frontend-central-bridge
      - name: CLIENTS_ONLY migration UI contract
        run: npm run test:frontend-client-migration-ui
      - name: Deployment cutover contract
        run: npm run test:deployment-cutover
      - name: Build production container
        run: docker build -t imperio-backend-ci .
      - name: Install Python parity dependency
        run: |
          python3 -m pip install --user playwright
          python3 -m playwright install chromium
      - name: Critical behavior characterization gate
        run: npm run test:characterization
      - name: Create CI administrator
        run: npm run admin:create
      - name: CLIENTS_ONLY rehearsal integration
        run: npm run test:client-batch-rehearsal
      - name: CLIENTS_ONLY Excel integration
        run: npm run test:client-excel
      - name: PostgreSQL/Nest integration tests
        run: npm run test:integration
      - name: V98b security integration tests
        run: npm run test:security-integration
      - name: Central catalog and professional configuration
        run: npm run test:catalog-config
      - name: Employee configuration readiness
        run: npm run test:employee-config-readiness
      - name: Read-only three-unit readiness diagnostic
        run: npm run test:three-unit-readiness
      - name: Release hardening contracts
        run: npm run test:release-hardening
      - name: Synthetic 13-to-22 migration rehearsal
        env:
          DATABASE_URL: postgresql://imperio:imperio_ci@localhost:5432/imperio_ci?schema=public
          SYNTHETIC_REHEARSAL: "1"
          OPERATIONAL_WRITES_ENABLED: "false"
          WHATSAPP_AUTOMATION_ENABLED: "false"
          EVOLUTION_WEBHOOK_ENABLED: "false"
          WHATSAPP_AGENT_API_ENABLED: "false"
        run: npm run test:migration-upgrade-rehearsal
      - name: Multi-unit operational write tests
        run: npm run test:operational-writes
      - name: Three-unit stock foundation
        run: npm run test:stock-foundation
      - name: BookingItem source-of-truth gate
        run: npm run test:booking-item-data-model
      - name: Multi-unit cash command payment flow
        run: npm run test:finance-flow
      - name: Three-unit public booking flow
        run: npm run test:public-booking
      - name: Empty-state integrated operational journey
        run: npm run test:empty-state-journey
