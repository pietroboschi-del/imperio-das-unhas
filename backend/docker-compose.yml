services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: imperio
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: imperio
    ports:
      - "5432:5432"
    volumes:
      - imperio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imperio -d imperio"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  imperio_pgdata:
